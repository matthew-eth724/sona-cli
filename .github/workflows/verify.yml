name: verify

# Proves a *built* binary on each OS, not just that the unit tests compile: doctor
# against that runner's ffmpeg and fonts, a render with text and captions, an
# awkward filename, a moved project, and (on macOS) a real whisper transcription.
# publish.yml only runs on tags; this runs on the work.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-15
            name: macos-arm64
            arch: arm64
          - os: macos-15-intel
            name: macos-x64
            arch: x64
          - os: windows-2025
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # macOS: the runner's Homebrew ffmpeg 9.0.2 ships without the `ass`/
      # `subtitles` filter, so caption and title burning silently degrades
      # there. Instead, fetch a pinned static libass-capable build
      # (ffmpeg-static b6.1.1); the four sha256 pins are hard-coded in
      # tools/ci/fetch-ffmpeg.sh, so no download is trusted blindly.
      # Rejected routes: BtbN (no macOS builds); evermeet (API 410/403);
      # osxexperts (per-tool zips, Intel lags); homebrew-ffmpeg tap (source
      # build, tens of minutes); conda-forge (solver and ~40 deps).
      - name: cache fetched ffmpeg (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.cache/splice-ffmpeg
          key: ffmpeg-static-b6.1.1-${{ matrix.arch }}-a90e3db6
      - name: fetch libass-capable ffmpeg (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: tools/ci/fetch-ffmpeg.sh "${{ matrix.arch }}" "$HOME/.cache/splice-ffmpeg/${{ matrix.arch }}"
      - name: put fetched ffmpeg first on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          FFMPEG_DIR="$HOME/.cache/splice-ffmpeg/${{ matrix.arch }}"
          export PATH="$FFMPEG_DIR:$PATH"
          echo "$FFMPEG_DIR" >> "$GITHUB_PATH"
          echo "SPLICE_FFMPEG=$FFMPEG_DIR" >> "$GITHUB_ENV"
          case "$(command -v ffmpeg)" in
            "$FFMPEG_DIR"/*) : ;;
            *) echo "ffmpeg resolved to $(command -v ffmpeg), not inside $FFMPEG_DIR" >&2; exit 1 ;;
          esac
      - name: show ffmpeg filters (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: ffmpeg -filters | grep -E ' (ass|subtitles) '

      - run: cargo build --release

      - name: what ffmpeg is actually here
        shell: bash
        # A runner can have more than one ffmpeg; knowing which one wins is the
        # difference between a product bug and a machine setup bug.
        run: |
          set -x
          command -v ffmpeg; ffmpeg -hide_banner -version | head -2
          ffmpeg -hide_banner -filters 2>/dev/null | grep -E ' (ass|subtitles) ' || echo "no ass/subtitles filter"
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E ' libx264 ' || echo "no libx264 encoder"

      - name: drive the binary
        shell: bash
        env:
          VERIFY_REQUIRE_LIBASS: ${{ runner.os == 'macOS' && '1' || '' }}
        run: |
          SPLICE=$([ "$RUNNER_OS" = "Windows" ] && echo "target/release/splice.exe" || echo "target/release/splice")
          SPLICE="$SPLICE" node tools/ci/verify.mjs platform

  # whisper rather than a hosted provider: no key, no cost, and it exercises the
  # same "call a program, parse its JSON, store the paths" seam. macOS because the
  # runner can synthesise speech with `say`, so nothing has to be committed.
  transcribe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: brew install ffmpeg whisper-cpp
      - name: cache the whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/splice-verify
          key: whisper-ggml-small.en
      - name: fetch a model once
        run: |
          mkdir -p ~/.cache/splice-verify
          [ -f ~/.cache/splice-verify/ggml-small.en.bin ] || \
            curl -fsSL -o ~/.cache/splice-verify/ggml-small.en.bin \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
      - run: cargo build --release
      - name: transcribe real speech
        run: |
          SPLICE=target/release/splice \
          WHISPER_PROGRAM="$(command -v whisper-cli || command -v whisper-cpp || echo /opt/homebrew/bin/whisper-cli)" \
          WHISPER_MODEL="$HOME/.cache/splice-verify/ggml-small.en.bin" \
          node tools/ci/verify.mjs transcribe

  # A hosted provider, only when asked: real TLS, real API shape, real key. Skipped on
  # every push and PR so a fork cannot spend the secret, and skipped when the secret is
  # absent rather than failing a fork's run. Windows is in the matrix on purpose — the
  # one thing a Linux runner cannot prove is that the TLS stack and the path escaping
  # work on the platform where npm users actually are.
  provider:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    # `secrets` is not allowed in a step-level `if`, so it comes in through env and the
    # step tests that: an absent secret skips the step instead of failing it.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: install ffmpeg and a voice (linux)
        if: runner.os == 'Linux'
        # espeak-ng synthesises the speech: this runner has no `say` and no
        # System.Speech, and committing a recording is worse than a TTS call.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo build --release

      - name: live transcription
        if: env.GEMINI_API_KEY != ''
        shell: bash
        env:
          PROVIDER: gemini
        run: |
          SPLICE=$([ "$RUNNER_OS" = "Windows" ] && echo "target/release/splice.exe" || echo "target/release/splice")
          # The key travels in the environment only: verify.mjs stores it with
          # `splice config set gemini.api_key --from-env`, never in argv.
          SPLICE="$SPLICE" node tools/ci/verify.mjs provider
