[package]
name = "splice-cli"
version = "0.1.5"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3.5.1"

[[bin]]
name = "splice"
path = "src/main.rs"
